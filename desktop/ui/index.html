<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>截屏快传 · 电脑接收端</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-content">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>截屏快传</span>
      </div>
      <span class="status" id="receiver-status" data-state="loading" role="status">正在连接接收端</span>
    </div>
  </header>

  <main class="shell">
    <div class="intro">
      <h1>电脑接收端</h1>
      <p>将手机和电脑连接到同一个局域网，即可配对并接收截图和录屏。</p>
    </div>

    <div class="settings">
      <section class="card pairing" aria-labelledby="pairing-heading">
        <div class="pairing-heading">
          <h2 id="pairing-heading">配对手机</h2>
          <button type="button" class="primary" id="open-pairing" aria-haspopup="dialog" aria-controls="pairing-dialog" disabled>
            <span class="scan-icon" aria-hidden="true"></span>扫码配对
          </button>
        </div>
        <div class="field">
          <label for="server-address">接收地址</label>
          <div class="field-controls">
            <select class="value" id="server-address" disabled>
              <option value="">正在获取地址</option>
            </select>
            <button type="button" id="copy-address" disabled>复制地址</button>
          </div>
        </div>
        <div class="field">
          <label for="pairing-code">配对码</label>
          <div class="field-controls">
            <div class="code-control">
              <input class="value" id="pairing-code" type="password" readonly autocomplete="off" spellcheck="false" placeholder="正在获取配对码">
              <button type="button" class="toggle-code" id="toggle-code" aria-label="显示配对码" aria-controls="pairing-code" disabled>显示</button>
            </div>
            <button type="button" id="copy-code" disabled>复制配对码</button>
          </div>
        </div>
        <p class="feedback" id="pairing-feedback" role="status"></p>
      </section>

      <section class="card destination" aria-labelledby="destination-heading">
        <span class="folder-mark" aria-hidden="true"><span class="folder-icon"></span></span>
        <h2 id="destination-heading">保存位置</h2>
        <p class="folder-path" id="folder-path" dir="auto">正在获取保存位置</p>
        <button type="button" class="open-folder" id="open-folder" disabled>打开文件夹<span aria-hidden="true">↗</span></button>
        <p class="feedback" id="folder-feedback" role="status"></p>
      </section>
    </div>

    <section class="card devices" aria-labelledby="devices-heading">
      <div class="activity-header">
        <h2 id="devices-heading">已配对设备</h2>
        <span class="file-count" id="devices-count" hidden></span>
      </div>
      <p class="devices-empty" id="devices-empty">正在读取已配对设备</p>
      <ul class="device-list" id="device-list" hidden></ul>
    </section>

    <section class="card activity" aria-labelledby="activity-heading">
      <div class="activity-header">
        <h2 id="activity-heading">最近接收</h2>
        <span class="file-count" id="file-count" hidden></span>
      </div>
      <div class="empty" id="empty-state">
        <div class="empty-mark" aria-hidden="true"><span class="file-icon"></span></div>
        <p class="empty-title" id="empty-title">正在读取接收记录</p>
        <p class="empty-description" id="empty-description">连接接收端后会自动更新。</p>
      </div>
      <ul class="files" id="recent-files" hidden></ul>
    </section>
    <footer class="footer" id="version" hidden></footer>
  </main>

  <dialog class="pairing-dialog" id="pairing-dialog" aria-labelledby="pairing-dialog-heading" aria-describedby="pairing-instructions">
    <div class="dialog-heading">
      <h2 id="pairing-dialog-heading">扫码配对</h2>
      <button type="button" id="close-pairing" autofocus>关闭</button>
    </div>
    <p class="dialog-copy" id="pairing-instructions">在手机端打开「扫码配对」，扫描下方二维码。二维码有效期内，多部手机可以使用同一个码。</p>
    <div class="field">
      <label for="pairing-address">二维码接收地址</label>
      <select class="value" id="pairing-address" disabled></select>
    </div>
    <div class="qr-display">
      <img class="pairing-image" id="pairing-image" alt="截屏快传配对二维码" width="256" height="256" hidden>
      <p class="feedback" id="qr-feedback" role="status"></p>
      <button type="button" id="refresh-pairing" hidden>重新生成</button>
    </div>
    <div class="qr-details">
      <p class="qr-expiry" id="pairing-expiry" hidden></p>
      <p class="dialog-devices" id="dialog-devices" role="status"></p>
    </div>
  </dialog>
</body>
</html>
