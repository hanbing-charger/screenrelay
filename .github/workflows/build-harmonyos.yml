name: Build HarmonyOS HAP
'on':
  workflow_dispatch:
    inputs:
      sign_hap:
        description: "Sign the HAP with Huawei debug signing materials"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.HARMONY_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check signing secrets
        if: inputs.sign_hap
        shell: bash
        env:
          HARMONY_REPO_PRIVATE: ${{ github.event.repository.private == true }}
          HARMONY_KEYSTORE_BASE64: ${{ secrets.HARMONY_KEYSTORE_BASE64 }}
          HARMONY_CERTIFICATE_BASE64: ${{ secrets.HARMONY_CERTIFICATE_BASE64 }}
          HARMONY_PROFILE_BASE64: ${{ secrets.HARMONY_PROFILE_BASE64 }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_ARTIFACT_PASSWORD: ${{ secrets.HARMONY_ARTIFACT_PASSWORD }}
        run: bash .github/scripts/sign-harmonyos-hap.sh --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up DevEco Command Line Tools
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          tool_dir="$(mktemp -d "$RUNNER_TEMP/deveco.XXXXXX")"
          archive="$tool_dir/deveco.zip"
          tools_path='harmonyos/ohpm/5.0.3/commandline-tools-linux-x64-5.0.3.906.zip'
          primary="https://mirrors.huaweicloud.com/$tools_path"
          secondary="https://repo.huaweicloud.com/$tools_path"
          archive_bytes=3225154486
          part_count=8
          part_bytes=$(((archive_bytes + part_count - 1) / part_count))

          download_part() {
            local part="$1" first="$2" second="$3"
            local start=$((part * part_bytes))
            local stop=$((start + part_bytes - 1))
            if ((stop >= archive_bytes)); then stop=$((archive_bytes - 1)); fi
            local size=$((stop - start + 1))
            local name url code
            name=$(printf '%s.part.%02d' "$archive" "$part")
            for url in "$first" "$second"; do
              if code=$(curl --fail --silent --show-error --location \
                --connect-timeout 20 --max-time 150 --speed-limit 32768 --speed-time 45 \
                --proto '=https' --proto-redir '=https' \
                --range "$start-$stop" --max-filesize "$size" \
                --write-out '%{http_code}' --output "$name" "$url") && \
                [[ "$code" == 206 && "$(stat -c '%s' "$name")" == "$size" ]]; then
                printf 'Downloaded toolchain part %s/%s\n' "$((part + 1))" "$part_count"
                return
              fi
            done
            echo "::error::Both archive mirrors failed on toolchain part $((part + 1))."
            return 1
          }

          pids=()
          for ((part = 0; part < part_count; part++)); do
            if ((part % 2 == 0)); then
              download_part "$part" "$primary" "$secondary" &
            else
              download_part "$part" "$secondary" "$primary" &
            fi
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          if ((failed)); then exit 1; fi
          cat "$archive".part.* > "$archive"
          rm -f -- "$archive".part.*
          printf '%s  %s\n' \
            'c6fe61299e1b05e4023e643a319ee74c3eb369af7edecd5c3f1795b16f9db6af' "$archive" \
            | sha256sum --check --status
          unzip -q "$archive" -d "$tool_dir"
          rm -f -- "$archive"
          tools="$tool_dir/command-line-tools"
          tool_bin="$tools/bin"
          test -x "$tool_bin/hvigorw"
          test -x "$tool_bin/ohpm"
          printf '%s\n' "$tool_bin" >> "$GITHUB_PATH"
          printf 'DEVECO_SIGN_TOOL=%s\n' "$tools/sdk/default/openharmony/toolchains/lib/hap-sign-tool.jar" >> "$GITHUB_ENV"

      - name: Build the entry HAP
        working-directory: harmonyos
        shell: bash
        run: |
          set -euo pipefail
          ohpm install --all
          (cd entry && ohpm install --all)
          hvigorw --mode module -p product=default -p module=entry@default \
            -p buildMode=debug assembleHap --no-daemon

      - name: Sign and verify the HAP
        if: inputs.sign_hap
        id: sign
        shell: bash
        env:
          HARMONY_REPO_PRIVATE: ${{ github.event.repository.private == true }}
          HARMONY_KEYSTORE_BASE64: ${{ secrets.HARMONY_KEYSTORE_BASE64 }}
          HARMONY_CERTIFICATE_BASE64: ${{ secrets.HARMONY_CERTIFICATE_BASE64 }}
          HARMONY_PROFILE_BASE64: ${{ secrets.HARMONY_PROFILE_BASE64 }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
          HARMONY_ARTIFACT_PASSWORD: ${{ secrets.HARMONY_ARTIFACT_PASSWORD }}
        run: bash .github/scripts/sign-harmonyos-hap.sh harmonyos/entry/build/default/outputs/default/entry-default-unsigned.hap

      - name: Upload the unsigned HAP
        if: ${{ !inputs.sign_hap }}
        uses: actions/upload-artifact@v6
        with:
          name: screenrelay-harmonyos-hap
          path: harmonyos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error


      - name: Upload the signed package
        if: inputs.sign_hap
        uses: actions/upload-artifact@v6
        with:
          name: screenrelay-harmonyos-signed
          path: ${{ steps.sign.outputs.artifact_path }}
          if-no-files-found: error
